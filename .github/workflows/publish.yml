name: Publish to pub.dev

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    name: Publish to pub.dev
    permissions:
      id-token: write # OIDC trusted publishing to pub.dev
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      # The publish job runs in the "release" environment: it waits for a
      # required reviewer, and only v* tags may deploy to it.
      environment: release
