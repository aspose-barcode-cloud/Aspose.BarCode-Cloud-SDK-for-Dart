name: "Dart test"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TEST_CONFIGURATION_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Test with coverage (>= 80% line gate)
        run: |
          chmod +x scripts/*
          make cover

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/coverage-badge.json
            coverage/coverage-summary.json
            coverage/lcov.info

      - name: Run snippets
        run: |
          ./scripts/run_snippets.sh
          git checkout scripts test_data

      - name: Dart analyze
        run: dart analyze --fatal-infos lib example

      - name: Dart check format
        run: dart format --output=none --set-exit-if-changed .

      - name: Dart try publish
        run: dart pub publish --dry-run

  publish-coverage:
    name: Publish coverage
    needs: build
    # Only pushes to the default branch publish, and only once the GitHub App for
    # the test-coverage repository is configured (COVERAGE_APP_ID variable).
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.COVERAGE_APP_ID != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - name: Get a token for the test-coverage repository
        id: coverage-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.COVERAGE_APP_ID }}
          private-key: ${{ secrets.COVERAGE_APP_PRIVATE_KEY }}
          owner: aspose-barcode-cloud
          repositories: test-coverage
          permission-contents: write
      - name: Publish to test-coverage
        run: python scripts/publish-coverage.py dart
        env:
          COVERAGE_TOKEN: ${{ steps.coverage-token.outputs.token }}
          COVERAGE_APP_SLUG: ${{ steps.coverage-token.outputs.app-slug }}
