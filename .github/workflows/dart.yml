name: "Dart test"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    env:
      TEST_CONFIGURATION_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Install dependencies
        run: dart pub get

      - name: Test with coverage (>= 80% line gate)
        run: |
          chmod +x scripts/*
          ./scripts/coverage.sh

      - name: Run snippets
        run: |
          ./scripts/run_snippets.sh
          git checkout scripts test_data

      - name: Dart analyze
        run: dart analyze --fatal-infos lib example

      - name: Dart check format
        run: dart format --output=none --set-exit-if-changed .

      - name: Dart try publish
        run: dart pub publish --dry-run
